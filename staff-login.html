<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Login — The Marsh Bites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <a href="home.html" class="nav-logo">
      <div class="mascot sm"><div class="mascot-inner">
        <div class="mascot-face"></div>
        <div class="mascot-eyebrow l"></div><div class="mascot-eyebrow r"></div>
        <div class="mascot-eye l"></div><div class="mascot-eye r"></div>
        <div class="mascot-mouth"></div>
      </div></div>
      <div class="nav-logo-text">The Marsh Bites</div>
    </a>
    <div class="nav-links">
      <a href="home.html" class="nav-link">Home</a>
      <a href="menu.html" class="nav-link">Menu</a>
      <a href="order.html" class="nav-link">Order</a>
      <a href="contact.html" class="nav-link">Contact</a>
    </div>
  </nav>

  <section class="login-layout">
    <form class="login-card" id="login-form">
      <h2>Staff Login</h2>
      <p class="login-sub">For the Marsh Bites kitchen team only 🧁</p>
      <div class="form-group"><label>Email</label><input type="email" id="login-email" required autocomplete="username"></div>
      <div class="form-group"><label>Password</label><input type="password" id="login-password" required autocomplete="current-password"></div>
      <p class="login-error" id="login-error"></p>
      <button type="submit" class="btn-place-order" id="login-btn">Sign In</button>
    </form>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">The Marsh Bites</div>
      <div class="footer-links">
        <a href="https://facebook.com/themarshbites" target="_blank">Facebook</a>
        <a href="https://instagram.com/themarshbites" target="_blank">Instagram</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
    <div class="footer-copy">© 2026 The Marsh Bites · San Pablo, Laguna</div>
  </footer>
<script type="module" src="js/staff-login.js"></script>
</body>
</html>
